name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # The NuGet Trusted Publishing policy (nuget.org account FZambia) names this repository, release.yml
    # and this environment.
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # NuGet Trusted Publishing

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update project version
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.get_version.outputs.VERSION }}<\/Version>/" src/Centrifugal.Centrifuge/Centrifugal.Centrifuge.csproj

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      run: dotnet pack src/Centrifugal.Centrifuge/Centrifugal.Centrifuge.csproj --configuration Release --no-build --output ./artifacts

    # Trusted Publishing: the job's OIDC token buys a short-lived API key, so no long-lived key is stored.
    # A version already on NuGet is skipped, so a rerun after a failure completes the release.
    - name: Log in to NuGet
      id: nuget
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: FZambia

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
